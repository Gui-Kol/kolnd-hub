version: 2
updates:
  # Dependências npm do Hub
  - package-ecosystem: npm
    directory: /kolnd-hub
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kolnd-hub
    commit-message:
      prefix: chore(deps)
    # Apenas minor/patch automáticos; majors ficam para avaliação manual
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
