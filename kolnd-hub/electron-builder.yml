appId: com.kolnd.hub
productName: Kolnd Hub
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!scripts/*'
  - '!resources/programs/**'
  - '!Mark-LVII/**'
  - '!*.log'
  - '!electron-builder.yml'
# The managed programs are bundled as extraResources so they land in
# <install dir>/resources/programs/... and Mark LVII/Kloud Games find their
# data files relative to the executable working directory.
extraResources:
  - from: resources/programs
    to: programs
    filter:
      - '**/*'
      # Never ship user data with the installer: Mark LVII writes its API
      # key and conversation memory next to the exe, and the bundled copy
      # may therefore hold real user data while being good for testing.
      - '!MarkLVII/config/api_keys.json'
      - '!MarkLVII/config/certs/**'
      - '!MarkLVII/config/whatsapp_web/**'
      - '!MarkLVII/memory/**'
  # O ícone da bandeja (lido via nativeImage.createFromPath em src/main/index.ts)
  # fica na raiz de resources/ em produção.
  - from: resources/tray-icon.png
    to: tray-icon.png
  # Sensores avançados (PawnIO): instalador assinado + módulos IntelMSR e
  # AMDFamily17. Os binários NÃO são versionados: `scripts/fetch-pawnio.ps1`
  # baixa e valida SHA-256/tamanho/Authenticode antes do empacotamento. Sem
  # eles, o instalador sai sem o recurso e a aba Monitor mostra "—" nos
  # sensores privilegiados (CPU temp/energia, energia total). pins.json e a
  # licença (COPYING) acompanham os binários.
  - from: resources/pawnio
    to: pawnio
    filter:
      - '**/*'
win:
  icon: resources/icon.ico
  # Nome explicito e estavel do artefato (NSIS respeita ${version}; o default
  # do electron-builder 24.x ja e "${productName} Setup ${version}.exe", aqui
  # fixamos para nao depender de default). Fonte unica da versao: package.json.
  artifactName: Kolnd Hub Setup ${version}.exe
  target:
    - nsis
nsis:
  oneClick: false
  # Per-user install (%LOCALAPPDATA%\Programs\Kolnd Hub): the install folder
  # stays writable, which MarkLVII.exe needs to create config/ and memory/
  # next to its executable on first run. Changing the install directory is
  # disallowed on purpose: picking a Program Files location would make the
  # bundled Mark LVII unable to write its data files there.
  perMachine: false
  allowToChangeInstallationDirectory: false
  # PRESERVADO na desinstalacao (deleteAppDataOnUninstall: false — o default):
  # %APPDATA%\kolnd-hub inteiro — first-run flag, config.json (electron-store),
  # logs\ (kolnd-hub.log, kloud-games-uninstall.log), kloud-games.paths.json.
  # REMOVIDO sempre pelo desinstalador: o diretorio de instalacao inteiro
  # ($INSTDIR, per-user em %LOCALAPPDATA%\Programs\Kolnd Hub), INCLUINDO
  # resources/programs/MarkLVII com os dados que o MarkLVII.exe grava ao lado
  # do exe (config/api_keys.json, memory/). Quem quiser guardar a chave/ memoria
  # do assistente deve usar o backup da tela de desinstalacao. Ver READMEs.
  # Sobre texto de aviso na tela de desinstalacao: o electron-builder nao
  # expoe um texto de desinstalacao configuravel para o usuario final —
  # nsis.uninstallDisplayName muda so o rotulo no "Aplicativos instalados" e
  # nsis.include (macro customUnInstall) escreve na secao de uninstall, cujo
  # output e escondido (ShowUninstDetails nevershow) e tambem rodaria no modo
  # silencioso. Por isso NAO criamos installer.nsh de proposito: a divulgacao
  # honesta do que e removido vs. preservado fica nos READMEs (ver
  # "Desinstalacao" em README.md e kolnd-hub/README.md). Nao mudar este flag
  # sem revisar a documentacao.
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
