[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KLOUD_GAMES"
version = "0.0.0"
description = "Python tooling for KLOUD_GAMES"
requires-python = ">=3.14"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "LizardByte", email = "lizardbyte@users.noreply.github.com"}
]

dependencies = [
    "lizardbyte-common[c]",
]

[dependency-groups]
# The CPM-fetched glad generator runs from its source tree and needs Jinja2.
glad = [
    "jinja2>=2.7,<4.0",
]

flatpak = [
    "flatpak_node_generator",
    "flatpak_pip_generator",
]

[project.urls]
Homepage = "https://KLOUD_GAMES.lizardbyte.dev"
Repository = "https://github.com/KLOUD_GAMESStream/KLOUD_GAMES"
Issues = "https://github.com/KLOUD_GAMESStream/KLOUD_GAMES/issues"

[tool.setuptools]
py-modules = []

[tool.uv.sources]
flatpak_node_generator = { path = "packaging/linux/flatpak/deps/flatpak-builder-tools/node" }
flatpak_pip_generator = { path = "packaging/linux/flatpak/deps/flatpak-builder-tools/pip" }
lizardbyte-common = { path = "third-party/lizardbyte-common" }
