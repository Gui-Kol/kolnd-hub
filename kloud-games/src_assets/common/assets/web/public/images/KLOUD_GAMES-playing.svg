<?xml version="1.0" encoding="utf-8"?>
<!-- KLOUD_GAMES logo - KG over a cloud on a deep indigo/violet squircle. -->
<svg version="1.1" id="KloudGamesLogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="28%" cy="22%" r="80%">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#E3E9FF"/>
      <stop offset="0.75" stop-color="#B4C4F5"/>
      <stop offset="1" stop-color="#8CA8E8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38356F"/>
      <stop offset="1" stop-color="#1B1936"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bgGlow)"/>
  <rect x="10.75" y="10.75" width="234.5" height="234.5" rx="53.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Ground shadow under the cloud -->
  <ellipse cx="128" cy="186" rx="58" ry="7" fill="#0A0620" fill-opacity="0.45"/>

  <!-- Cloud (behind the letters) -->
  <g fill="url(#cloudGrad)">
    <circle cx="87" cy="152" r="30"/>
    <circle cx="126" cy="121" r="44"/>
    <circle cx="166" cy="150" r="29"/>
    <rect x="60" y="148" width="135" height="34" rx="17"/>
  </g>

  <!-- Letters: KG (soft shadow pass, then dark gradient pass) -->
  <g fill="#0A0620" fill-opacity="0.35" transform="translate(0 2.5)">
    <path d="M64 110 h13 v26.5 L109 110 h16.5 L107.2 139.5 L128 176 h-17.5 L77 143.5 V176 H64 Z"/>
    <path d="M192 121.7 A33 33 0 1 0 192 162.3 L182.2 154.6 A20.5 20.5 0 1 1 182.2 129.4 Z"/>
    <rect x="163.6" y="137" width="34" height="10.5" rx="2.5"/>
  </g>
  <g fill="url(#textGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1">
    <path d="M64 110 h13 v26.5 L109 110 h16.5 L107.2 139.5 L128 176 h-17.5 L77 143.5 V176 H64 Z"/>
    <path d="M192 121.7 A33 33 0 1 0 192 162.3 L182.2 154.6 A20.5 20.5 0 1 1 182.2 129.4 Z"/>
    <rect x="163.6" y="137" width="34" height="10.5" rx="2.5"/>
  </g>
  <!-- Status badge -->
  <circle cx="192" cy="192" r="34" fill="#22C55E" stroke="#141129" stroke-width="7"/>
  <path d="M184.5 177.5 L209.5 192 L184.5 206.5 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
